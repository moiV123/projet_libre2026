{% extends "front/base.html" %}

{% block content %}

<main class="editor-page">

    <form
        method="POST"
        action="{{ url_for('create_post') }}"
        enctype="multipart/form-data"
        class="post-form"
    >

        <h1>Nouvel article</h1>

        <label>Titre</label>

        <input
            type="text"
            name="title"
            class="article-title"
            required
        >

        <div class="editor-toolbar">

            <button type="button" id="add-text">
                + Texte
            </button>

            <button type="button" id="add-code">
                + Code
            </button>

        </div>

        <div id="editor" class="editor">

            <!-- Les blocs seront ajoutés ici par JS -->

        </div>

        <label>Image</label>

        <input
            type="file"
            name="image"
            accept="image/*"
        >

        <label>Tags</label>

        <div class="tags-container">

            {% for tag in tags %}
                <label class="tag-checkbox">
                    <input
                        type="checkbox"
                        name="tags"
                        value="{{ tag }}"
                    >
                    {{ tag }}
                </label>
            {% endfor %}

        </div>

        <button
            type="submit"
            class="publish-btn"
        >
            Publier
        </button>

    </form>

</main>

<script src="{{ url_for('static', filename='editeur.js') }}"></script>

{% endblock %}
