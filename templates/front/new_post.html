{% extends 'front/base.html' %}

{% block content %}

<main class="m-10 p-10 border-2 rounded-lg">
    <h1 class="flex justify-center text-2xl">Créer un article</h1>

    <form method="POST" action="{{ url_for('create_post') }}" enctype="multipart/form-data">

        <div>
            <label>Titre</label>
            <input type="text" name="title" required placeholder="Titre de l'article">
        </div>

        <div class="editor-toolbar">
            <button type="button" id="code_add">+ Bloc code</button>
            <button type="button" id="text_add">+ Texte</button>
        </div>

        <div id="content" class="editor-content"></div>

        <div class="code_place">
        <div class="code_header">
            <select class="language_select">
                <option value="html">HTML</option>
                <option value="css">CSS</option>
                <option value="javascript">JavaScript</option>
                <option value="python">Python</option>
                <option value="c">C</option>
                <option value="cpp">C++</option>
            </select>
        </div>

        <textarea class="code_input"></textarea>
        </div>

        <div>
            <label>Image</label>
            <input type="file" name="image" accept="image/*">
        </div>

        <div>
            <label>Choisis tes tags :</label>
            <div>
                {% for tag in tags %}
                    <input type="checkbox" id="{{ tag }}" name="tags" value="{{ tag }}">
                    <label for="{{ tag }}">{{ tag }}</label>
                {% endfor %}
            </div>
        </div>

        <!-- BOUTON -->
        <button type="submit">Publier</button>

    </form>

</main>

{% endblock %}
