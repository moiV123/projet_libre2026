{% extends 'front/base.html' %}

{% block content %}

<main class = "m-10 p-10 border-2 round-lg">
    <h1 class = "flex justify-center text-2xl">Ajoute un pokemon</h1>
    <form method = "POST" action = "{{url_for('create_pokemon')}}" enctype = "multipart/form-data">
      <!--Nom-->
      <div>
        <label>Nom</label>
        <input type="text" name="nom" required placeholder="Nom du pokemon">
      </div>

      <!--Type-->
      <div>
        <label>Type</label>
        <select type="text" name="type" required placeholder="type du pokemon">
          <option value="Feu">Feu</option>
          <option value="Eau">Eau</option>
          <option value="Electrique">Electrique</option>
          <option value="Feu">Plantes</option>
          <option value="Eau">Eau</option>
          <option value="Electrique">Electrique</option>
        </select>
      </div>

      <!--image-->
      <div>
        <label>image du pokemon</label>
        <input type="file" name="image" accept="image/*">
      </div>

       <!--Description-->
      <div>
        <label>description</label>
        <textarea name="description" rows="4" required placeholder="décrit ton pokemon"></textarea>
      </div>

      <!--Tags-->

      <div>
        <label for="">Choisis tes tags :</label>
        <div>
            {% for tag in tags %}
                <input type="checkbox" id="{{tag}}" name="tags" value="{{tag}}" class="">
                <label for="{{tag}}">{{tag}}</label>
            {% endfor %}
        </div>
    </div>
    <p>
        {% for tag in tags %}
            <span>{{ tag }}</span>
        {% endfor %}
    </p>
    <div>
        <a href="{{ url_for('like_article', article_id=article.id)}}"></a>
        <p> {{article.like}}</p>
    </div>

      <!--Bouton-->
      <button type="submit"></button>

    </form>


</main>

{% endblock %}
