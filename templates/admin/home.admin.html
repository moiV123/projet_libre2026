{% extends "front/base.html" %}
{% block content %}

<section>
    <table>
        <thead>
            <th>Pseudo</th>
            <th>Mot de passe</th>
            <th>Photo de profil</th>
            <th>Rôle</th>
        </thead>
        <tbody>
            {% for user in users %}
            <tr>
                <td>{{user.username}}</td>
                <td>{{user.password}}</td>
                <td><img src="{{user.pdp}}" alt="Photo de profil" width="50"></td>
                <td>{{user.role}}</td>
                <td href="/">Voir</td>
                <td href="/">Modifier</td>
                <td href="/">Supprimer</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</section>

{% endblock %}
