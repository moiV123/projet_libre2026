{% extends "templates" %}
{% block content %}

<section>
    <table>
        <thead>
            <th>Titre</th>
            <th>Auteur</th>
        </thead>
        <tbody>
            {% for article in articles %}
            <tr>
                <td>{{article.title}}</td>
                <td>{{article.author}}</td>
                <td href="/">Voir</td>
                <td href="/">Modifier</td>
                <td href="/">Supprimer</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</section>

{% endblock %}
