{% extends "front/base.html" %}
{% block content %}

<main class="articles-container">

    {% for item in articles %}
    <article class="article-card">

        <h2 class="article_title">{{ item.title }}</h2>

        {% if item.image %}
            <img src="{{ item.image }}" alt="image article">
        {% endif %}

        <p>{{ item.text }}</p>

    </article>
    {% endfor %}

</main>

{% endblock %}
