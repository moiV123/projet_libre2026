{% extends "front/base.html" %}
{% block content %}

<main>
    <article>
        {% for item in articles %}

            <h2 class="article_title">{{ item.title }}</h2>

            {% if item.image %}
                <img src="{{ item.image }}" alt="image article">
            {% endif %}

            <p>{{ item.text }}</p>

        {% endfor %}
    </article>
</main>

{% endblock %}
